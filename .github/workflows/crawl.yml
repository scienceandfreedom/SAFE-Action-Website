name: SAFE Action Intelligence Crawl

on:
  schedule:
    - cron: '0 6 * * *'      # Daily at 6am UTC — full crawl
    - cron: '0 0,12,18 * * *' # Every 6 hours outside full crawl — news only
  workflow_dispatch:
    inputs:
      mode:
        description: 'Crawl mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - news-only

permissions:
  contents: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Full crawls (all 50 states + federal bills + analysis) can exceed 60 min
    # on slow-API days and were being killed at the timeout, leaving bill data
    # unrefreshed. 120 gives headroom while still bounding a runaway.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        run: |
          cd crawler
          pip install -e .

      - name: Determine crawl mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
              echo "mode=full" >> $GITHUB_OUTPUT
            else
              echo "mode=news-only" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ inputs.mode }}" = "news-only" ]; then
            echo "mode=news-only" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Run crawler
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "news-only" ]; then
            python -m crawler.main --news-only
          else
            python -m crawler.main
          fi

      - name: Build streamer-mode snapshot
        if: steps.mode.outputs.mode != 'news-only'
        run: python scripts/build_live.py --repo .

      - name: Commit and push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update intelligence data (${{ steps.mode.outputs.mode }}) [skip ci]"
          git push

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: firebase-adminsdk-fbsvc@safe-action-website.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy refreshed data to Firebase Hosting
        run: firebase deploy --only hosting --project safe-action-website
