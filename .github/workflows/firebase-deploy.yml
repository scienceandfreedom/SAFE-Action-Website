name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: firebase-adminsdk-fbsvc@safe-action-website.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting,firestore --project safe-action-website

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Write Cloud Functions environment
        env:
          GOOGLE_CHAT_SPACE: ${{ secrets.GOOGLE_CHAT_SPACE || vars.GOOGLE_CHAT_SPACE }}
          GOOGLE_CALENDAR_EVENT_ID: ${{ secrets.GOOGLE_CALENDAR_EVENT_ID || vars.GOOGLE_CALENDAR_EVENT_ID }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID || vars.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          OFFICER_EMAIL: ${{ secrets.OFFICER_EMAIL || vars.OFFICER_EMAIL || 'greg@scienceandfreedom.com' }}
          SITE_URL: https://scienceandfreedom.com
        run: |
          : "${GOOGLE_DRIVE_PARENT_FOLDER_ID:?Missing GOOGLE_DRIVE_PARENT_FOLDER_ID repository secret or variable}"
          : "${OFFICER_EMAIL:?Missing OFFICER_EMAIL repository secret or variable}"
          {
            printf 'GOOGLE_DRIVE_PARENT_FOLDER_ID=%s\n' "$GOOGLE_DRIVE_PARENT_FOLDER_ID"
            printf 'OFFICER_EMAIL=%s\n' "$OFFICER_EMAIL"
            printf 'SITE_URL=%s\n' "$SITE_URL"
            if [ -n "$GOOGLE_CHAT_SPACE" ]; then
              printf 'GOOGLE_CHAT_SPACE=%s\n' "$GOOGLE_CHAT_SPACE"
            fi
            if [ -n "$GOOGLE_CALENDAR_EVENT_ID" ]; then
              printf 'GOOGLE_CALENDAR_EVENT_ID=%s\n' "$GOOGLE_CALENDAR_EVENT_ID"
            fi
          } > functions/.env.safe-action-website

      - name: Deploy Cloud Functions
        # --force: sets the artifact cleanup policy non-interactively (deploy
        # otherwise exits 1 with 'could not set up cleanup policy')
        run: firebase deploy --only functions --project safe-action-website --force
